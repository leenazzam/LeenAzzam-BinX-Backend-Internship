name: build-and-test-cardiac-api

on:
  push:
    branches: [ "**" ]
    paths:
      - "cardiac/**"
      - ".github/workflows/cardiac-build-test.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "cardiac/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore "cardiac/CardiacPatientMonitoring.Tests/CardiacPatientMonitoring.Tests.csproj"

      - name: Build
        run: dotnet build "cardiac/CardiacPatientMonitoring.Tests/CardiacPatientMonitoring.Tests.csproj" --no-restore --configuration Release

      - name: Test
        run: dotnet test "cardiac/CardiacPatientMonitoring.Tests/CardiacPatientMonitoring.Tests.csproj" --no-build --configuration Release --verbosity normal
