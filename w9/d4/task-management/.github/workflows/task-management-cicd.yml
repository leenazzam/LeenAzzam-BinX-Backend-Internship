name: Task Management CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  API_PROJECT: 'WebApplication1/WebApplication1.csproj'
  TEST_PROJECT: 'WebApplication1.Tests/WebApplication1.Tests.csproj'
  PUBLISH_DIR: '${{ github.workspace }}/publish'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build API
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore --no-incremental

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore API
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Restore tests
        run: dotnet restore ${{ env.TEST_PROJECT }}

      - name: Run tests
        run: dotnet test ${{ env.TEST_PROJECT }} --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

  deploy:
    name: Deploy to Azure App Service
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-restore --output ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}
