name: build-and-test-task-api

on:
  push:
    branches: [ "**" ]
    paths:
      - "task&project/**"
      - ".github/workflows/task-build-test.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "task&project/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore "task&project/WebApplication1.Tests/WebApplication1.Tests.csproj"

      - name: Build
        run: dotnet build "task&project/WebApplication1.Tests/WebApplication1.Tests.csproj" --no-restore --configuration Release

      - name: Test
        run: dotnet test "task&project/WebApplication1.Tests/WebApplication1.Tests.csproj" --no-build --configuration Release --verbosity normal
